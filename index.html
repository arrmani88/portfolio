<!doctype html>
<html lang="en" data-theme="futuristic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('theme')
        if (['futuristic', 'second'].indexOf(storedTheme) !== -1) {
          document.documentElement.setAttribute('data-theme', storedTheme)
        }
      } catch (e) {}
      try {
        var storedLanguage = localStorage.getItem('language')
        if (['en', 'ar', 'de', 'fr'].indexOf(storedLanguage) !== -1) {
          document.documentElement.lang = storedLanguage
          document.documentElement.dir = storedLanguage === 'ar' ? 'rtl' : 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Covers any unstyled flash while CSS/JS are still loading; removed once the
         page has actually finished loading -->
    <div id="pre-load-cover" style="position: fixed; inset: 0; background: #000; z-index: 99999"></div>
    <script>
      window.addEventListener('load', function () {
        var cover = document.getElementById('pre-load-cover')
        if (cover) cover.remove()
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
